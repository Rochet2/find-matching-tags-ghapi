name: 'Filter tags'
description: 'Find / filter / search / query repository tags with regex'
inputs:
  regex:
    description: 'regex pattern to match a tag with'
    required: true
  flags:
    description: 'regex flags applied to the pattern (e.g. "i" for case-insensitive)'
    required: false
    default: ''
  owner:
    description: 'repository owner username or organization name. Defaults to the repository of the calling workflow'
    required: false
    default: ''
  repo:
    description: 'repository name. Defaults to the repository of the calling workflow'
    required: false
    default: ''
  token:
    description: 'github token used to authenticate API calls. Defaults to the workflow token. See https://docs.github.com/en/rest/overview/resources-in-the-rest-api#requests-from-github-actions'
    required: false
    default: ${{ github.token }}
  per_page:
    description: 'results per page to fetch, between [1,100]'
    required: false
    default: '100'
  page:
    description: 'page number to fetch from (ignored when paginate is true)'
    required: false
    default: '1'
  paginate:
    description: 'when true, fetch every tag across all pages (ignores the page input)'
    required: false
    default: 'true'
  sort:
    description: 'sort order of output tags: asc, desc (alphabetical), semver, or semver-desc'
    required: false
    default: 'asc'
outputs:
  tags:
    description: 'JSON array of the matched tags'
  count:
    description: 'number of matched tags'
runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  icon: 'tag'
  color: 'blue'
