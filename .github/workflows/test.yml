on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify_build:
    runs-on: ubuntu-latest
    name: Verify dist is up to date
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check dist is committed
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "dist/ is out of date. Run 'npm run build' and commit the changes." >&2
            git status --porcelain dist
            git --no-pager diff dist
            exit 1
          fi

  filter_tags_job:
    runs-on: ubuntu-latest
    name: Test tag filtering
    needs: verify_build
    steps:
      - uses: actions/checkout@v6

      - name: Find matching tags asc
        id: find_matching_tags_asc
        uses: ./
        with:
          regex: ^TEST\-.*
          sort: asc
          owner: Rochet2
          repo: find-matching-tags-ghapi

      - name: Assert asc output
        env:
          ACTUAL: ${{ steps.find_matching_tags_asc.outputs.tags }}
          EXPECTED: '["TEST-1","TEST-2","TEST-3"]'
        run: |
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Expected $EXPECTED, got $ACTUAL"
            exit 1
          fi

      - name: Find matching tags desc
        id: find_matching_tags_desc
        uses: ./
        with:
          regex: ^TEST\-.*
          sort: desc
          owner: Rochet2
          repo: find-matching-tags-ghapi

      - name: Assert desc output
        env:
          ACTUAL: ${{ steps.find_matching_tags_desc.outputs.tags }}
          EXPECTED: '["TEST-3","TEST-2","TEST-1"]'
        run: |
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Expected $EXPECTED, got $ACTUAL"
            exit 1
          fi

      - name: Print first element of asc and desc output
        env:
          ASC_TAGS: ${{ steps.find_matching_tags_asc.outputs.tags }}
          DESC_TAGS: ${{ steps.find_matching_tags_desc.outputs.tags }}
        run: |
          echo "asc first:  $(echo "$ASC_TAGS"  | jq -r '.[0]')"
          echo "desc first: $(echo "$DESC_TAGS" | jq -r '.[0]')"

      - name: Find matching tags case-insensitive via flags
        id: find_matching_tags_ci
        uses: ./
        with:
          regex: ^test\-.*
          flags: i
          sort: asc
          owner: Rochet2
          repo: find-matching-tags-ghapi

      - name: Assert case-insensitive flag works
        env:
          ACTUAL: ${{ steps.find_matching_tags_ci.outputs.tags }}
          EXPECTED: '["TEST-1","TEST-2","TEST-3"]'
        run: |
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Expected $EXPECTED, got $ACTUAL"
            exit 1
          fi

      - name: Assert count output
        env:
          ACTUAL: ${{ steps.find_matching_tags_ci.outputs.count }}
          EXPECTED: '3'
        run: |
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Expected $EXPECTED, got $ACTUAL"
            exit 1
          fi
