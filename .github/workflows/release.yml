name: Update major-version tag

# When a release like v1.2.3 is published, move the v1 tag to point at the
# same commit so consumers pinned to `@v1` automatically get the new release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update_major_tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag and move major tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if ! echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag '$RELEASE_TAG' is not in vX.Y.Z form; skipping."
            exit 0
          fi
          MAJOR="$(echo "$RELEASE_TAG" | cut -d. -f1)"
          echo "Pointing $MAJOR at $RELEASE_SHA ($RELEASE_TAG)"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git tag -f "$MAJOR" "$RELEASE_SHA"
          git push -f origin "$MAJOR"
