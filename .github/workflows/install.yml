name: Build dist
on:
  # Auto-rebuild dist when source changes land on main. Triggering manually
  # (or on a feature/dependabot branch) is also supported via workflow_dispatch.
  push:
    branches: [main]
    paths:
      - 'index.js'
      - 'action.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run build

      - name: Commit dist if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f dist
          git diff-index --quiet HEAD || git commit -m "Rebuild dist"

      - name: Push changes
        run: git push origin HEAD:${{ github.ref }}
